<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshKart | Cart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast"></div>
  <header class="navbar glass sticky">
    <a class="brand" href="index.html">Fresh<span>Kart</span></a>
    <nav class="nav-links"><a href="products.html">Shop</a></nav>
  </header>

  <main class="container cart-layout">
    <section>
      <h1>Your Cart</h1>
      <div id="cartItems"></div>
    </section>
    <aside class="card summary">
      <h3>Price Breakdown</h3>
      <div id="priceBreakdown"></div>
      <label>Coupon Code
        <input id="couponInput" placeholder="FRESH150" />
      </label>
      <a href="checkout.html" class="btn btn-primary">Proceed to Checkout</a>
    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
